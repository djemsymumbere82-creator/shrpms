{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
<h1 class="h4 mb-3">Change password</h1>
<form method="post" class="card card-body">
 <label class="form-label">Current password</label><input name="old" type="password" class="form-control mb-3" required>
 <label class="form-label">New password (8+ characters)</label><input name="new" type="password" class="form-control mb-3" required>
 <label class="form-label">Confirm new password</label><input name="confirm" type="password" class="form-control mb-3" required>
 <button class="btn btn-primary">Save password</button>
</form></div></div>{% endblock %}
