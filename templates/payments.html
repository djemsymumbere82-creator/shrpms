{% extends "base.html" %}{% block content %}
<h1 class="h4 mb-3">Payments</h1>
<form method="post" class="row g-2 mb-4">
 <div class="col-md-3"><select name="tenant_id" class="form-select" required><option value="">Tenant...</option>
  {% for t in tenants %}<option value="{{ t.id }}">{{ t.user.full_name }} (balance {{ '{:,.0f}'.format(t.balance) }})</option>{% endfor %}</select></div>
 <div class="col-md-2"><input name="amount" type="number" step="0.01" min="1" class="form-control" placeholder="Amount" required></div>
 <div class="col-md-2"><select name="method" class="form-select"><option>M-Pesa</option><option>Cash</option><option>Bank</option></select></div>
 <div class="col-md-3"><input name="reference" class="form-control" placeholder="Reference (e.g. M-Pesa code)"></div>
 <div class="col-md-2"><button class="btn btn-primary w-100">Record payment</button></div></form>
<table class="table table-sm bg-white"><tr><th>Receipt</th><th>Date</th><th>Tenant</th><th>Method</th><th class="text-end">Amount</th><th></th></tr>
{% for p in payments %}<tr><td>{{ p.receipt_no }}</td><td>{{ p.paid_on }}</td><td>{{ p.tenant.user.full_name }}</td><td>{{ p.method }}</td>
 <td class="text-end">{{ '{:,.2f}'.format(p.amount) }}</td><td><a href="{{ url_for('receipt', pid=p.id) }}">Download PDF</a></td></tr>
{% else %}<tr><td colspan="6">No payments recorded yet.</td></tr>{% endfor %}</table>{% endblock %}
