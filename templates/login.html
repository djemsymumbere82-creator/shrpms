{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
<h1 class="h4 mb-3">Log in</h1>
<form method="post" class="card card-body">
 <label class="form-label">Username</label><input name="username" class="form-control mb-3" required autofocus>
 <label class="form-label">Password</label><input name="password" type="password" class="form-control mb-3" required>
 <button class="btn btn-primary">Log in</button>
</form></div></div>{% endblock %}
